services:
  rabbitmq:
    container_name: safed-translate-rabbitmq
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}

  safed-translate-bot:
    container_name: safed-translate-bot
    image: safed-translate-bot-prod:latest
    restart: unless-stopped
    build: .
    env_file:
      - .env
    depends_on:
      - rabbitmq
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - BOT_TYPE=${BOT_TYPE}
      - TZ=${TZ}
      - TOKEN=${TOKEN}
      - START_VIDEO_FILE_ID=${START_VIDEO_FILE_ID}
      - REGISTER_VIDEO_FILE_ID=${REGISTER_VIDEO_FILE_ID}
      - BOT_NAME=${BOT_NAME}
      - BOT_USERNAME=${BOT_USERNAME}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL}
      - PORT=${PORT}
      - JOIN_LINK=${JOIN_LINK}
      - WEB_PAGE_URL=${WEB_PAGE_URL}
      - FEEDBACK_GROUP_ID=${FEEDBACK_GROUP_ID}
      - MAX_MEDIA_SIZE_MB=${MAX_MEDIA_SIZE_MB}
      - PDF_MAX_PAGES=${PDF_MAX_PAGES}
      - XLSX_MAX_ROWS=${XLSX_MAX_ROWS}
      - MAX_OCR_TEXT_CHARS=${MAX_OCR_TEXT_CHARS}
      - RABBITMQ_ENABLED=${RABBITMQ_ENABLED}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
      - UPDATE_QUEUE_PREFETCH=${UPDATE_QUEUE_PREFETCH}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_API_KEY=${SUPABASE_API_KEY}
    volumes:
      - ./logs/safed-translate-bot/prod/b2c:/app/logs
